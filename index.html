<title>Site Book (field)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: switchroom site book — fixed left index of stages like a binder's tabbed dividers, working sheet on the right.
   Hold points in amber, phase chips in AU red/white/blue. */
:root{
  --bg:#e9edf0; --surface:#ffffff; --surface-2:#f4f6f8; --ink:#141d26; --muted:#56636f; --line:#d3dae0;
  --accent:#0d5a8a; --accent-ink:#ffffff; --accent-soft:#e1edf5;
  --hold:#a65800; --hold-bg:#fff1dc; --ok:#23744a; --ok-bg:#e2f2e8; --bad:#b0281f; --bad-bg:#fbe7e4;
  --ph1:#c62828; --ph2:#f7f7f7; --ph3:#1d5fbf; --ph2-ink:#222;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#161f28; --surface-2:#1c2731; --ink:#e2e8ee; --muted:#93a0ac; --line:#2b3742;
  --accent:#5fb0e4; --accent-ink:#06121b; --accent-soft:#16334a;
  --hold:#f0a54e; --hold-bg:#2d2112; --ok:#6cc690; --ok-bg:#14271c; --bad:#ff8b80; --bad-bg:#2e1614;
  --ph1:#e05a55; --ph2:#e6e6e6; --ph3:#5b93e6; --ph2-ink:#111; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#161f28; --surface-2:#1c2731; --ink:#e2e8ee; --muted:#93a0ac; --line:#2b3742;
  --accent:#5fb0e4; --accent-ink:#06121b; --accent-soft:#16334a;
  --hold:#f0a54e; --hold-bg:#2d2112; --ok:#6cc690; --ok-bg:#14271c; --bad:#ff8b80; --bad-bg:#2e1614;
  --ph1:#e05a55; --ph2:#e6e6e6; --ph3:#5b93e6; --ph2-ink:#111; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:700}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.08rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.brand .mark{width:22px;height:22px;border:2px solid currentColor;border-radius:3px;display:grid;place-items:center;font-size:.7rem}
.top .sp{flex:1}
.top select{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);border-radius:var(--r);padding:5px 8px;color:var(--bg);max-width:240px}
.top select option{color:var(--ink);background:var(--surface)}
.who{font-size:.85rem;opacity:.85;display:flex;align-items:center;gap:6px}
.who img{width:22px;height:22px;border-radius:50%}
.menu-btn{display:none;background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:var(--r);padding:5px 10px}

/* layout */
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100% - 50px)}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px 40px;position:sticky;top:50px;align-self:start;max-height:calc(100vh - 50px);overflow:auto}
nav.side .grp{margin:14px 6px 4px}
nav.side a{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:var(--r);color:var(--ink);text-decoration:none;font-size:.93rem;cursor:pointer}
nav.side a:hover{background:var(--surface-2)}
nav.side a.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
nav.side a .code{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);min-width:22px}
nav.side a .pct{margin-left:auto;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 80px;min-width:0}
.page{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:inline-block}
  nav.side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);display:none}
  nav.side.open{display:block}
  .top select{max-width:150px}
}

/* blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{background:transparent;border:0;padding:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.head{display:flex;flex-direction:column;gap:6px}
.lede{max-width:68ch;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.hold{background:var(--hold-bg);color:var(--hold);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.ph{display:inline-block;min-width:26px;text-align:center;font-family:var(--f-mono);font-size:.74rem;font-weight:600;border-radius:3px;padding:1px 4px}
.ph.L1{background:var(--ph1);color:#fff}.ph.L2{background:var(--ph2);color:var(--ph2-ink);border:1px solid var(--line)}.ph.L3{background:var(--ph3);color:#fff}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:600;font-size:.9rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:.82rem}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.84rem;font-weight:600;color:var(--muted);min-width:0}
input.i,select.i,textarea.i{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 9px;font-weight:400;color:var(--ink);width:100%;min-width:0}
textarea.i{min-height:70px;resize:vertical}
.hint{font-weight:400;font-size:.78rem;color:var(--muted)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
@media (max-width:640px){.tabs{flex-wrap:wrap;overflow:visible}.tabs button{padding:8px 10px}}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:.98rem;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}

/* steps */
.steps{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.step{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.step:first-child{border-top:0}
.step.hold{box-shadow:inset 4px 0 0 var(--hold)}
.step .n{font-family:var(--f-mono);font-weight:600;color:var(--muted);padding-top:2px}
.step h4{font-family:var(--f-body);font-size:1rem;font-weight:700;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.step p{color:var(--ink);opacity:.9;margin-top:2px;max-width:72ch}
.step.done h4{color:var(--ok)}
.sign{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:130px}
.tick{width:30px;height:30px;border-radius:6px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-weight:700;color:var(--accent-ink)}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.sign.ctsign{min-width:0;flex-direction:column;align-items:flex-end;gap:4px}
.ctsign .stamp{font-size:.7rem;white-space:nowrap}
.phs{display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-end}
.ph{display:flex;flex-direction:column;gap:2px;font:600 .72rem/1.1 var(--f-mono);color:var(--muted)}
.ph select{font:700 .88rem/1 var(--f-body);padding:6px 2px;border:2px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:66px}
.ph.v-Pass select{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.ph.v-Fail select{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.ph select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:560px){.sign.ctsign{align-items:flex-start}.phs{justify-content:flex-start}.ctsign .stamp{text-align:left}}
.stamp{font-size:.75rem;color:var(--muted);text-align:right;line-height:1.3}
.val{font-family:var(--f-mono);font-size:.86em;background:var(--accent-soft);color:var(--accent);padding:0 5px;border-radius:3px;font-weight:600}
.val.unset{background:var(--hold-bg);color:var(--hold)}
@media (max-width:560px){.step{grid-template-columns:30px minmax(0,1fr)} .sign{grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start}.stamp{text-align:left}}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
table.t th{font-family:var(--f-display);font-weight:600;text-align:left;font-size:.82rem;letter-spacing:.03em;color:var(--muted);background:var(--surface-2);padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td input,table.t td select{border:1px solid transparent;background:transparent;padding:4px 5px;border-radius:4px;width:100%;min-width:70px}
table.t td input:hover,table.t td select:hover{border-color:var(--line)}
table.t td input:focus,table.t td select:focus{border-color:var(--accent);background:var(--surface)}
table.rcard td input,table.rcard td select{border:1.5px solid var(--line-strong,#9aa4b2);background:var(--surface);padding:7px 8px;border-radius:6px;min-height:36px}
table.rcard td input:focus,table.rcard td select:focus{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:0}
table.rcard td input:disabled,table.rcard td select:disabled{border-style:dashed;opacity:.75}
table.t td.wide input{min-width:310px}
table.t td.calc{font-family:var(--f-mono);color:var(--accent);white-space:nowrap}
table.t td .pf-Pass{color:var(--ok);font-weight:700}table.t td .pf-Fail{color:var(--bad);font-weight:700}

/* matrix */
table.mx{border-collapse:separate;border-spacing:3px;font-size:.8rem;font-variant-numeric:tabular-nums}
table.mx th{font-family:var(--f-mono);font-weight:600;color:var(--muted);padding:2px 4px;text-align:center}
table.mx th.pl{text-align:left;font-family:var(--f-display);font-size:.9rem;color:var(--ink);white-space:nowrap}
table.mx td.c{min-width:46px;height:30px;text-align:center;border-radius:4px;cursor:pointer;font-family:var(--f-mono);font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
table.mx td.c.p1{background:var(--hold-bg);color:var(--hold);border-color:transparent}
table.mx td.c.p2{background:var(--ok);color:#fff;border-color:transparent}
table.mx td.c.na{background:transparent;border-style:dashed;color:var(--muted)}
table.mx td.x{background:transparent;border:0;cursor:default}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok)}
.stat{display:flex;flex-direction:column;gap:6px}
.stat b{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}

/* role cards */
.role{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:8px}
.role h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.row>*{min-width:0}
select.i{max-width:100%;text-overflow:ellipsis}
.role .num{font-family:var(--f-mono);font-size:.8rem;background:var(--ink);color:var(--bg);border-radius:4px;padding:1px 6px}
.role ul{margin:0;padding-left:18px}

/* artefacts */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.thumb{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.thumb .img{aspect-ratio:4/3;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;max-width:100%}
.thumb .img img{width:100%;height:100%;object-fit:cover}
.thumb .img .ft{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.thumb .cap{padding:6px 8px;font-size:.78rem;display:flex;flex-direction:column;gap:2px;min-width:0}
.thumb .cap b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* diagrams */
.diagram{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px}
.diagram svg{display:block;width:100%;min-width:480px;height:auto}
.d-box{fill:var(--surface-2);stroke:var(--ink);stroke-width:1.5}
.d-bar{fill:var(--muted);opacity:.55}
.d-term rect{fill:var(--surface);stroke:var(--ink)}
.d-t{fill:var(--ink);font:600 13px var(--f-display)}
.d-s{fill:var(--muted);font:12px var(--f-body)}
.d-hold{fill:var(--hold)}.d-bad{fill:var(--bad)}
.d-wire{fill:none;stroke:var(--ink);stroke-width:2}
.d-dim{opacity:.4}
.d-lead{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4}
.d-hv{fill:none;stroke:var(--bad);stroke-width:3}
.d-dot{fill:var(--accent)}
.d-bolt{stroke:var(--ink);stroke-width:4}
.d-zone{fill:none;stroke:var(--hold);stroke-width:2;stroke-dasharray:8 6}
.d-earth line{stroke:var(--ink);stroke-width:2}
.d-coil{fill:none;stroke:var(--ink);stroke-width:2}
.d-ct{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.d-short{stroke:var(--hold);stroke-width:5}

ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.note{border-left:3px solid var(--hold);background:var(--hold-bg);padding:10px 12px;border-radius:0 var(--r) var(--r) 0;font-size:.9rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:var(--r);font-size:.9rem;z-index:50;max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:.82rem}
@media (prefers-reduced-motion:no-preference){.tick{transition:background .12s}}

/* guided flow */
.wrap{display:block}
.topbtn{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:var(--r);padding:5px 10px;cursor:pointer;font-weight:600;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbtn span{opacity:.7;font-weight:400}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.88rem}
.crumbs a{color:var(--accent);text-decoration:none;font-weight:600}
.crumbs a:hover{text-decoration:underline}
.crumbs .sep{color:var(--muted)}
.crumbs [aria-current]{color:var(--muted)}
button.bcard,button.stile,button.mtile,button.pitem{font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:100%}
button.bcard:hover,button.stile:hover,button.mtile:hover,button.pitem:hover{border-color:var(--accent)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.bcard{padding:18px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.bname{font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1.1}
.bstages{display:flex;flex-direction:column;gap:6px;width:100%;margin-top:8px}
.bst{display:grid;grid-template-columns:110px minmax(0,1fr) 40px;gap:8px;align-items:center}
.bst .mono{text-align:right;font-size:.78rem}
.stiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.stile{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:18px;align-items:start}
.stile .sl{font-family:var(--f-display);font-weight:700;font-size:3rem;line-height:.9;color:var(--accent)}
.sbody{display:flex;flex-direction:column;gap:4px;min-width:0}
.sname{font-family:var(--f-display);font-weight:700;font-size:1.45rem}
.mtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mtile{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.mtile b{font-family:var(--f-display);font-size:1.08rem}
.mtile .muted{font-size:.84rem}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:grid;grid-template-columns:52px minmax(0,1fr) 90px;gap:12px;padding:14px;align-items:start}
.pcode{font-family:var(--f-mono);font-weight:600;font-size:1.05rem;color:var(--accent);padding-top:1px}
.pbody{display:flex;flex-direction:column;gap:2px;min-width:0}
.pbody b{font-family:var(--f-display);font-size:1.15rem}
.ppct{display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:right;font-family:var(--f-mono);font-weight:600}
@media (max-width:560px){.pitem{grid-template-columns:44px minmax(0,1fr)}.ppct{grid-column:2;text-align:left}.bst{grid-template-columns:96px minmax(0,1fr) 36px}}

.ttiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
button.ttile{font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;width:100%}
button.ttile:hover{border-color:var(--accent)}
.tcode{font-family:var(--f-display);font-weight:700;font-size:2.6rem;line-height:.9;color:var(--accent);letter-spacing:.02em}
.tname{font-family:var(--f-display);font-weight:700;font-size:1.4rem}
.tsubs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tcount{font-size:.84rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;width:100%}

.navrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
